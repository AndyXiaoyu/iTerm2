name: Cleanup Branches

on:
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Delete all branches except release_3.6.6
      run: |
        KEEP_BRANCH="release_3.6.6"
        
        echo "Keeping only branch: $KEEP_BRANCH"
        
        # 获取所有分支
        git fetch origin
        
        # 删除除 release_3.6.6 外的所有分支
        for branch in $(git branch -r | grep -v "origin/HEAD" | sed 's/origin\///' | tr -d ' '); do
          if [ "$branch" != "$KEEP_BRANCH" ]; then
            echo "Attempting to delete: $branch"
            git push origin --delete "$branch" || true
          fi
        done
        
        echo "Cleanup completed!"
